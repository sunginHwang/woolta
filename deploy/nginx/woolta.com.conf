# woolta.com — 대시보드 Next (pm2: woolta-dashboard, :4300)

server {
    listen 443 ssl http2;
    server_name woolta.com www.woolta.com;

    # ssl_certificate     /etc/letsencrypt/live/woolta.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/woolta.com/privkey.pem;

    access_log /var/log/nginx/woolta.com.access.log;
    error_log  /var/log/nginx/woolta.com.error.log;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:4300;
        include /etc/nginx/snippets/woolta-next.conf;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4300;
        include /etc/nginx/snippets/woolta-next.conf;
    }
}

server {
    listen 80;
    server_name woolta.com www.woolta.com;
    return 301 https://$host$request_uri;
}
