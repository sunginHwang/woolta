# blog.woolta.com — Next (pm2: woolta-blog, :8091)
#
# 레거시 Spring jar(:8090)는 이 vhost 와 무관하다.
# api-blog.woolta.com 이 따로 있고, FE 이관이 끝나면 그쪽만 내리면 된다.

server {
    listen 443 ssl http2;
    server_name blog.woolta.com;

    # ssl_certificate     /etc/letsencrypt/live/blog.woolta.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/blog.woolta.com/privkey.pem;

    access_log /var/log/nginx/blog.woolta.com.access.log;
    error_log  /var/log/nginx/blog.woolta.com.error.log;

    # 정적 자산은 해시가 붙어 불변이다 — 길게 캐시한다
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8091;
        include /etc/nginx/snippets/woolta-next.conf;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        include /etc/nginx/snippets/woolta-next.conf;
    }
}

server {
    listen 80;
    server_name blog.woolta.com;
    return 301 https://$host$request_uri;
}
