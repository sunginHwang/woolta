fragment StatisticItemParts on StatisticItem {
  title
  amount
  registerDateTime
}

fragment StatisticParts on Statistic {
  categoryId
  categoryName
  amount
  percentage
  useStatistic
  list {
    ...StatisticItemParts
  }
}

query GetAccountBookStatisticList(
  $startDate: DateTime!
  $endDate: DateTime!
  $type: AccountBookCategoryType!
  $onlyUseStatistic: Boolean
) {
  getAccountBookStatisticList(startDate: $startDate, endDate: $endDate, type: $type, onlyUseStatistic: $onlyUseStatistic) {
    totalCount
    itemList {
      ...StatisticParts
    }
  }
}
