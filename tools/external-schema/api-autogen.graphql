"""
초대 결과. 실패도 에러가 아닌 코드로 돌려준다 — 화면이 상황별 안내를 띄워야 하고,
'이미 공유 중' 같은 건 예외 상황이 아니기 때문이다.
"""
type RequestCalendarShareResult {
  code: RequestCalendarShareResultCode!
  """성사된 경우에만 채워진다"""
  share: CalendarShare
}

enum RequestCalendarShareResultCode {
  """상대가 이미 나를 초대해 둬서 즉시 수락 처리했다"""
  ACCEPTED_MUTUAL
  """내가 보낸 초대가 이미 대기 중이다"""
  ALREADY_PENDING
  """이미 공유 중이다"""
  ALREADY_SHARED
  """초대를 새로 보냈다"""
  REQUESTED
  """자기 자신은 초대할 수 없다"""
  SELF
  """가입되지 않은 이메일이다"""
  USER_NOT_FOUND
}

