# 전 도메인 통합 GraphQL 스키마 — FE codegen 용.
# scripts/mergeSchema.ts 가 생성. 직접 수정 금지 (npm run mergeSchema 로 재생성).

scalar DateTime

scalar JSON

type Query {
  account(id: ID!): Account
  accountBook(id: ID!): AccountBook
  accountBookCategoryImageList: AccountBookCategoryImageList!
  accountBookCategoryList: AccountBookCategoryList!
  accountBookList(dateTime: DateTime!): AccountBookList!
  accountList(limitCount: Int): AccountList!
  articleCategoryList: ArticleCategoryList!
  articleList(categoryId: String): ArticleList!
  bucketList(id: ID!): BucketList
  bucketListSummaryList(limitCount: Int): BucketListSummaryList!
  """
  기간과 겹치는 일정 — 내 일정 + 공유 수락된 상대의 일정.
  겹침 판정은 startAt < range.endAt AND endAt > range.startAt.
  """
  calendarEventList(input: CalendarEventRangeInput!): CalendarEventList!
  """공유 현황 — 수락된 관계 + 내가 보낸 대기 중 초대"""
  calendarShareList: CalendarShareList!
  categoryList: CategoryList!
  checkAccess: Int!
  getAccountBookStatisticList(endDate: DateTime!, startDate: DateTime!, type: AccountBookCategoryType!): StatisticList!
  getAccountLastUpdatedDate: DateTime!
  getBucketListItemLastUpdatedDate(id: ID!): DateTime!
  getBucketListLastUpdatedDate: DateTime!
  getRecentPostList(limitCount: Int): PostList!
  getShareCode: String!
  mainInfo: MainInfo!
  me: UserInfo!
  memo(id: String!): Memo
  memoList: MemoList!
  """내가 받은 대기 중 초대. 로그인 직후 알림 배지에 쓴다"""
  pendingCalendarShareList: CalendarShareList!
  post(categoryNo: Int!, postNo: Int!): Post
  postList(categoryId: Int): PostList!
  regularExpenditureGroupList(limitCount: Int): RegularExpenditureGroupList!
  todoCategoryList: TodoCategoryList!
  todoList: TodoList!
  user(id: ID!): User
  weeklyCurationList: WeeklyCurationList!
}

type Mutation {
  addArticleToCuration(input: AddArticleToCurationInput!): WeeklyCuration!
  cancelCalendarShare(input: CancelCalendarShareInput!): Boolean!
  completeAccountExpiration(input: CompleteAccountExpirationInput!): Boolean!
  completeBucketList(input: CompleteBucketListInput!): Boolean!
  completeTodo(input: CompleteTodoInput!): Todo!
  createAccount(input: CreateAccountInput!): Account!
  createAccountBook(input: CreateAccountBookInput!): AccountBook!
  createAccountBookCategory(input: CreateAccountBookCategoryInput!): AccountBookCategory!
  createAccountBookList(input: CreateAccountBookListInput!): CreateAccountBookListResult!
  createArticle(input: CreateArticleInput!): Article!
  createArticleCategory(input: CreateArticleCategoryInput!): ArticleCategory!
  createBucketList(input: CreateBucketListInput!): BucketList!
  createBucketListTodo(input: CreateBucketListTodoInput!): BucketListTodo!
  createCalendarEvent(input: CreateCalendarEventInput!): CalendarEvent!
  createDeposit(input: CreateDepositInput!): Deposit!
  createMemo: Memo!
  createPost(input: CreatePostInput!): PostUpsertResult!
  createRegularExpenditure(input: CreateRegularExpenditureInput!): RegularExpenditure!
  createTodo(input: CreateTodoInput!): Todo!
  createTodoCategory(input: CreateTodoCategoryInput!): TodoCategory!
  deleteAccount(input: DeleteAccountInput!): Boolean!
  deleteAccountBook(input: DeleteAccountBookInput!): Boolean!
  deleteAccountBookCategory(input: DeleteAccountBookCategoryInput!): Boolean!
  deleteArticle(input: DeleteArticleInput!): Boolean!
  deleteArticleCategory(input: DeleteArticleCategoryInput!): Boolean!
  deleteBucketList(input: DeleteBucketListInput!): Boolean!
  deleteBucketListTodo(input: DeleteBucketListTodoInput!): Boolean!
  deleteCalendarEvent(input: DeleteCalendarEventInput!): Boolean!
  deleteMemo(input: DeleteMemoInput!): Boolean!
  deletePost(input: DeletePostInput!): Boolean!
  deleteRegularExpenditure(input: DeleteRegularExpenditureInput!): Boolean!
  deleteTodo(input: DeleteTodoInput!): Boolean!
  deleteTodoCategory(input: DeleteTodoCategoryInput!): Boolean!
  emptyTrash: Boolean!
  importArticleList(input: ImportArticleListInput!): ArticleImportResult!
  importMemoList(input: ImportMemoListInput!): MemoImportResult!
  importTodoList(input: ImportTodoListInput!): TodoImportResult!
  loginByShareCode(input: LoginByShareCodeInput!): UserInfo!
  loginBySocial(input: LoginBySocialInput!): UserInfo!
  logout: Boolean!
  """refresh 쿠키로 세션 갱신(회전). 토큰 값은 인자로도 응답으로도 오가지 않고 쿠키로만 처리된다."""
  refreshSession: Boolean!
  removeArticleFromCuration(input: RemoveArticleFromCurationInput!): WeeklyCuration!
  requestCalendarShare(input: RequestCalendarShareInput!): RequestCalendarShareResult!
  respondCalendarShare(input: RespondCalendarShareInput!): CalendarShare!
  restoreTodo(input: RestoreTodoInput!): Todo!
  sendPushToAll(input: SendPushToAllInput!): Boolean!
  subscribeWebPush(input: SubscribeWebPushInput!): Boolean!
  trashTodo(input: TrashTodoInput!): Todo!
  unsubscribeWebPush(input: UnsubscribeWebPushInput!): Boolean!
  updateAccountBook(input: UpdateAccountBookInput!): AccountBook!
  updateArticle(input: UpdateArticleInput!): Article!
  updateArticleCategory(input: UpdateArticleCategoryInput!): ArticleCategory!
  updateBucketList(input: UpdateBucketListInput!): BucketList!
  updateBucketListTodoComplete(input: UpdateBucketListTodoCompleteInput!): BucketListTodo!
  updateCalendarEvent(input: UpdateCalendarEventInput!): CalendarEvent!
  updateMemo(input: UpdateMemoInput!): Memo!
  updatePost(input: UpdatePostInput!): PostUpsertResult!
  updateTodo(input: UpdateTodoInput!): Todo!
  updateTodoCategory(input: UpdateTodoCategoryInput!): TodoCategory!
  upsertShareCode: String!
}

